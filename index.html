<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230284c7'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E譯%3C/text%3E%3C/svg%3E" />
  <title>AI 실시간 동시통역기</title>
  <link rel="stylesheet" href="./style.css?v=7" />
</head>
<body>
  <header>
    <h1>AI 실시간 동시통역기</h1>
    <div class="header-right">
      <span id="headerTierBadge" class="tier-badge">무료 키</span>
      <span id="statusBadge" class="status-badge">대기</span>
      <button id="toggleSettingsBtn" class="settings-toggle" type="button">설정</button>
    </div>
  </header>

  <nav id="quickLangBar" class="quick-lang-bar" aria-label="상대방 언어 선택">
    <button type="button" class="quick-lang-btn active" data-lang="en">영어</button>
    <button type="button" class="quick-lang-btn" data-lang="zh">중국어</button>
    <button type="button" class="quick-lang-btn" data-lang="ja">일본어</button>
    <button type="button" class="quick-lang-btn" data-lang="es">스페인어</button>
  </nav>

  <div class="log-toolbar">
    <div class="log-toolbar-left">
      <span id="sessionTimerBadge" class="session-timer-badge">대기</span>
      <button id="soundTestBtn" class="btn-tool sound-test-btn" type="button">소리 테스트</button>
    </div>
    <div class="log-toolbar-actions">
      <button id="summarizeBtn" class="btn-tool summary-btn" type="button">이중언어 요약</button>
      <button id="shareLogBtn" class="btn-tool share-btn" type="button">공유하기</button>
      <button id="copyLogBtn" class="btn-tool" type="button">복사</button>
      <button id="downloadTxtBtn" class="btn-tool" type="button">TXT 저장</button>
    </div>
  </div>

  <section id="settingsPanel" class="settings-panel">
    <div class="tier-selector-box">
      <div class="tier-box-title">API 키 등급 원터치 전환</div>
      <div class="tier-switch-grid">
        <button type="button" id="selectFreeTierBtn" class="tier-choice-btn active-free">1. 일상용 무료 키</button>
        <button type="button" id="selectPaidTierBtn" class="tier-choice-btn">2. 미팅·학술 유료 키</button>
      </div>

      <div class="field-group">
        <label for="freeApiKeyInput">1. 일상용 무료 API 키 (Free Tier)</label>
        <div class="api-key-row">
          <input type="password" id="freeApiKeyInput" placeholder="무료 프로젝트 AIzaSy..." />
          <button type="button" class="btn-key-toggle" data-target="freeApiKeyInput">표시</button>
          <button type="button" class="btn-file-load" data-file-target="freeKeyFileInput">파일</button>
          <input type="file" id="freeKeyFileInput" accept=".txt,.env,.json,text/plain" style="display: none;" />
        </div>
      </div>

      <div class="field-group">
        <label for="paidApiKeyInput">2. 미팅·학술용 유료 API 키 (결제 연결 프로젝트 · 카본 지원)</label>
        <div class="api-key-row">
          <input type="password" id="paidApiKeyInput" placeholder="유료 프로젝트 AIzaSy..." />
          <button type="button" class="btn-key-toggle" data-target="paidApiKeyInput">표시</button>
          <button type="button" class="btn-file-load" data-file-target="paidKeyFileInput">파일</button>
          <input type="file" id="paidKeyFileInput" accept=".txt,.env,.json,text/plain" style="display: none;" />
        </div>
      </div>
      <div id="keyStatusMsg" class="key-status-msg"></div>
    </div>

    <div class="row-2">
      <div class="field-group">
        <label for="modelSelect">실시간 통역 AI 모델</label>
        <select id="modelSelect">
          <option value="gemini-3.8-flash" selected>gemini-3.8-flash (표준 초고속)</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (최고속·무료권장)</option>
          <option value="gemini-3.7-flash">gemini-3.7-flash</option>
          <option value="gemini-3.6-flash">gemini-3.6-flash</option>
          <option value="gemini-4-carbon">gemini-4-carbon (제미나이 카본·유료키)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="summaryModelSelect">회의록 요약 AI 모델</label>
        <select id="summaryModelSelect">
          <option value="gemini-3.8-flash" selected>gemini-3.8-flash (빠른 요약)</option>
          <option value="gemini-4-carbon">gemini-4-carbon (카본 정밀 요약·유료키)</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
        </select>
      </div>
    </div>

    <div class="row-2">
      <div class="field-group">
        <label for="partnerLangSelect">상대방 언어</label>
        <select id="partnerLangSelect">
          <option value="en">영어 (English)</option>
          <option value="zh">중국어 (中文/普通话)</option>
          <option value="ja">일본어 (日本語)</option>
          <option value="es">스페인어 (Español)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="autoModeSelect">통역 방향 잠금 설정</label>
        <select id="autoModeSelect">
          <option value="to_ko_only" selected>외국어 → 한국어 고정</option>
          <option value="from_ko_only">한국어 → 외국어 고정</option>
          <option value="auto_both">자동 양방향 (오디오 감지)</option>
        </select>
      </div>
    </div>

    <div class="row-2">
      <div class="field-group">
        <label for="duplexModeSelect">오디오 환경 선택</label>
        <select id="duplexModeSelect">
          <option value="full_duplex" selected>이어폰·연속강연 (무중단 동시통역·전체기록)</option>
          <option value="smart_guard">스피커 대화 (문장 완성 후 발화·에코방지)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="ttsRateSelect">통역 음성 읽기 속도</label>
        <select id="ttsRateSelect">
          <option value="1.0">보통 속도 (1.0배)</option>
          <option value="1.15" selected>동시통역 표준 (1.15배)</option>
          <option value="1.3">빠른 속도 (1.3배)</option>
        </select>
      </div>
    </div>

    <div class="row-2">
      <div class="field-group">
        <label for="chunkIntervalSelect">연속발화 구절 분할 길이</label>
        <select id="chunkIntervalSelect">
          <option value="short">짧은 구절 단위 (빠른 반응)</option>
          <option value="medium" selected>표준 의미 구절 단위 (권장)</option>
          <option value="long">완전 문장 단위 (정확도 우선)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="toneSelect">통역 어투</label>
        <select id="toneSelect">
          <option value="polite">존댓말/정중체</option>
          <option value="casual">구어체/친근체</option>
          <option value="formal">격식체 (학술/미팅)</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label for="glossaryInput">상황 및 전문 용어집 (선택 입력)</label>
      <textarea id="glossaryInput" placeholder="고유명사나 학술·비즈니스 전문 용어를 입력하면 실시간 통역과 요약에 즉시 반영됩니다."></textarea>
    </div>
  </section>

  <section class="dual-live-monitor">
    <div class="monitor-pane">
      <div class="monitor-head">
        <span id="origLangLabel">실시간 원문 연속 타이핑 (영어 인식)</span>
        <span id="ch1StateText">대기</span>
      </div>
      <div id="liveOriginalStream" class="monitor-text"></div>
    </div>
    <div class="monitor-pane trans">
      <div class="monitor-head">
        <span>실시간 동시통역 누적 출력</span>
        <span id="ch2StateText">대기</span>
      </div>
      <div id="liveTranslatedStream" class="monitor-text"></div>
    </div>
  </section>

  <main id="transcriptBox" class="transcript-container"></main>

  <footer class="controls">
    <div class="mic-gate-row">
      <div class="visualizer-bar">
        <div id="volumeFill" class="visualizer-fill"></div>
      </div>
      <span id="micStateLabel" class="mic-state-label">대기</span>
    </div>
    <div class="text-send-row">
      <input type="text" id="manualTextInput" placeholder="문장 직접 입력 후 음성 전송..." />
      <button type="button" id="sendTextBtn" class="btn-text-send">음성 전송</button>
    </div>
    <div class="dir-lock-grid" id="dirLockGrid">
      <button type="button" class="dir-lock-btn active" data-mode="to_ko_only" id="btnLockToKo">영어 → 한국어 고정</button>
      <button type="button" class="dir-lock-btn" data-mode="from_ko_only" id="btnLockFromKo">한국어 → 영어 고정</button>
      <button type="button" class="dir-lock-btn" data-mode="auto_both" id="btnLockAuto">자동 양방향</button>
    </div>
    <div class="btn-row">
      <button id="mainActionBtn" class="btn-main btn-start" type="button">통역 시작</button>
      <button id="sysAudioBtn" class="btn-sys-audio" type="button">탭 소리 입력</button>
      <button id="clearBtn" class="btn-clear" type="button">지우기</button>
    </div>
  </footer>

  <script src="./interpreter_engine.js?v=7"></script>
  <script src="./app.js?v=7"></script>
</body>
</html>
