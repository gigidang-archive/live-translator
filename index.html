<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230284c7'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E譯%3C/text%3E%3C/svg%3E" />
  <title>AI 완전 자동 양방향 실시간 음성통역기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      background-color: #1e293b;
      padding: 11px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    .header-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tier-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      background-color: #1e3a8a;
      color: #93c5fd;
      border: 1px solid #2563eb;
      cursor: pointer;
    }
    .tier-badge.paid {
      background-color: #78350f;
      color: #fcd34d;
      border-color: #d97706;
    }
    .status-badge {
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 999px;
      background-color: #334155;
      color: #cbd5e1;
      font-weight: 600;
    }
    .status-badge.connected {
      background-color: #065f46;
      color: #6ee7b7;
    }
    .status-badge.speaking {
      background-color: #9a3412;
      color: #fed7aa;
    }
    .status-badge.error {
      background-color: #7f1d1d;
      color: #fca5a5;
    }
    .settings-toggle {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .quick-lang-bar {
      background-color: #1e293b;
      padding: 8px 12px;
      border-bottom: 1px solid #334155;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .quick-lang-btn {
      background-color: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .quick-lang-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
    }
    .log-toolbar {
      background-color: #162032;
      padding: 6px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .log-toolbar-title {
      font-size: 12px;
      color: #94a3b8;
    }
    .log-toolbar-actions {
      display: flex;
      gap: 6px;
    }
    .btn-tool {
      background-color: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-tool.success {
      background-color: #065f46;
      border-color: #10b981;
      color: #6ee7b7;
    }
    .settings-panel {
      background-color: #1e293b;
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 64dvh;
      overflow-y: auto;
    }
    .settings-panel.hidden {
      display: none;
    }
    .tier-selector-box {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tier-switch-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .tier-choice-btn {
      padding: 9px 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .tier-choice-btn.active-free {
      background-color: #1d4ed8;
      border-color: #60a5fa;
      color: #ffffff;
    }
    .tier-choice-btn.active-paid {
      background-color: #b45309;
      border-color: #fbbf24;
      color: #ffffff;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-group label {
      font-size: 12px;
      color: #94a3b8;
    }
    .field-group input, .field-group select, .field-group textarea {
      background-color: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    .field-group textarea {
      resize: vertical;
      min-height: 48px;
    }
    .api-key-row {
      display: flex;
      gap: 5px;
      align-items: stretch;
    }
    .api-key-row input[type="password"],
    .api-key-row input[type="text"] {
      flex: 1;
      min-width: 0;
      font-size: 13px;
    }
    .btn-file-load {
      background-color: #0369a1;
      color: #ffffff;
      border: 1px solid #0284c7;
      padding: 0 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-key-toggle {
      background-color: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .key-status-msg {
      font-size: 11px;
      color: #34d399;
      min-height: 15px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .transcript-container {
      flex: 1;
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 16px;
      word-break: keep-all;
      animation: fadeIn 0.2s ease;
    }
    .bubble.system {
      background-color: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
    }
    .bubble.error-diag {
      background-color: #450a0a;
      border: 1px solid #dc2626;
      border-left: 4px solid #ef4444;
      color: #fecaca;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }
    .error-diag-title {
      font-weight: 700;
      color: #fca5a5;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .error-diag-reason {
      background-color: #1f0505;
      padding: 6px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      color: #fda4af;
      margin: 6px 0;
      white-space: pre-wrap;
    }
    .error-diag-hint {
      color: #fef08a;
      font-size: 12px;
      margin-top: 4px;
    }
    .bubble.user-speech {
      background-color: #1e293b;
      border-left: 3px solid #64748b;
      color: #cbd5e1;
      font-size: 14px;
    }
    .bubble.translated-out {
      background-color: #172554;
      border-left: 4px solid #38bdf8;
      color: #ffffff;
      font-size: 18px;
      font-weight: 500;
    }
    .bubble-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .bubble-label {
      font-size: 11px;
      color: #7dd3fc;
      font-weight: 600;
    }
    .bubble-time {
      font-size: 10px;
      color: #64748b;
    }
    .controls {
      background-color: #1e293b;
      padding: 10px 16px 18px 16px;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .mic-gate-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .visualizer-bar {
      flex: 1;
      height: 6px;
      background-color: #0f172a;
      border-radius: 3px;
      overflow: hidden;
    }
    .visualizer-fill {
      height: 100%;
      width: 0%;
      background-color: #38bdf8;
      transition: width 0.08s linear, background-color 0.15s;
    }
    .visualizer-fill.muted {
      width: 100% !important;
      background-color: #f97316;
    }
    .mic-state-label {
      font-size: 11px;
      color: #94a3b8;
      min-width: 78px;
      text-align: right;
      font-weight: 600;
    }
    .mic-state-label.muted {
      color: #fb923c;
    }
    .mode-status-bar {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #0284c7;
      background-color: #0f172a;
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .mode-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background-color: #0369a1;
      color: #ffffff;
    }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-main {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-start {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-stop {
      background-color: #dc2626;
      color: #ffffff;
    }
    .btn-clear {
      padding: 0 16px;
      background-color: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>AI 실시간 음성 동시통역</h1>
      <div class="header-sub">말하면 즉시 음성 송출 + 화면 문자 기록</div>
    </div>
    <div class="header-right">
      <span id="headerTierBadge" class="tier-badge">무료 키</span>
      <span id="statusBadge" class="status-badge">대기 중</span>
      <button id="toggleSettingsBtn" class="settings-toggle">설정</button>
    </div>
  </header>

  <nav id="quickLangBar" class="quick-lang-bar" aria-label="상대방 언어 빠른 선택">
    <button type="button" class="quick-lang-btn active" data-lang="en">영어</button>
    <button type="button" class="quick-lang-btn" data-lang="zh">중국어</button>
    <button type="button" class="quick-lang-btn" data-lang="ja">일본어</button>
    <button type="button" class="quick-lang-btn" data-lang="es">스페인어</button>
  </nav>

  <div class="log-toolbar">
    <span class="log-toolbar-title">대화 기록 내보내기</span>
    <div class="log-toolbar-actions">
      <button id="copyLogBtn" class="btn-tool" type="button">대화 복사</button>
      <button id="downloadTxtBtn" class="btn-tool" type="button">TXT 저장</button>
    </div>
  </div>

  <section id="settingsPanel" class="settings-panel">
    <div class="tier-selector-box">
      <div style="font-size: 12px; color: #cbd5e1; font-weight: 600;">사용할 API 키 등급 원터치 선택</div>
      <div class="tier-switch-grid">
        <button type="button" id="selectFreeTierBtn" class="tier-choice-btn active-free">일상용 무료 키 사용</button>
        <button type="button" id="selectPaidTierBtn" class="tier-choice-btn">미팅·학술 유료 키 사용</button>
      </div>

      <div class="field-group">
        <label for="freeApiKeyInput">1. 일상용 무료 API 키 (Free Tier)</label>
        <div class="api-key-row">
          <input type="password" id="freeApiKeyInput" placeholder="무료 프로젝트 AIzaSy..." />
          <button type="button" class="btn-key-toggle" data-target="freeApiKeyInput">표시</button>
          <button type="button" class="btn-file-load" data-file-target="freeKeyFileInput">파일</button>
          <input type="file" id="freeKeyFileInput" accept=".txt,.env,.json,text/plain" style="display: none;" />
        </div>
      </div>

      <div class="field-group">
        <label for="paidApiKeyInput">2. 미팅·학술용 유료 API 키 (결제 연결 프로젝트)</label>
        <div class="api-key-row">
          <input type="password" id="paidApiKeyInput" placeholder="유료 프로젝트 AIzaSy..." />
          <button type="button" class="btn-key-toggle" data-target="paidApiKeyInput">표시</button>
          <button type="button" class="btn-file-load" data-file-target="paidKeyFileInput">파일</button>
          <input type="file" id="paidKeyFileInput" accept=".txt,.env,.json,text/plain" style="display: none;" />
        </div>
      </div>

      <div id="keyStatusMsg" class="key-status-msg"></div>
    </div>

    <div class="row-2">
      <div class="field-group">
        <label for="partnerLangSelect">상대방 언어</label>
        <select id="partnerLangSelect">
          <option value="en">영어 (English)</option>
          <option value="zh">중국어 (中文/普通话)</option>
          <option value="ja">일본어 (日本語)</option>
          <option value="es">스페인어 (Español)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="autoModeSelect">통역 작동 방식</label>
        <select id="autoModeSelect">
          <option value="auto_both">완전 자동 양방향 (누를 필요 없음)</option>
          <option value="to_ko_only">상대방 말 듣기 고정 (외국어→한국어)</option>
          <option value="from_ko_only">내 말 전달 고정 (한국어→외국어)</option>
        </select>
      </div>
    </div>
    <div class="row-2">
      <div class="field-group">
        <label for="echoGuardSelect">오디오 환경 및 에코 차단</label>
        <select id="echoGuardSelect">
          <option value="speaker">스피커 모드 (음성 출력 중 마이크 자동 차단)</option>
          <option value="earphone">이어폰 모드 (동시 송수신 허용)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="voiceOutputSelect">음성 출력 설정</label>
        <select id="voiceOutputSelect">
          <option value="on">즉시 음성 출력 + 화면 문자 기록</option>
          <option value="off">무음 모드 (화면 문자만 기록)</option>
        </select>
      </div>
    </div>
    <div class="row-2">
      <div class="field-group">
        <label for="toneSelect">통역 어투</label>
        <select id="toneSelect">
          <option value="polite">자연스러운 존댓말/정중체</option>
          <option value="casual">구어체/친근한 대화</option>
          <option value="formal">격식체 (비즈니스/학술)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="voiceNameSelect">AI 통역사 목소리</label>
        <select id="voiceNameSelect">
          <option value="Aoede">Aoede (차분한 여성)</option>
          <option value="Puck">Puck (경쾌한 남성)</option>
          <option value="Charon">Charon (중후한 남성)</option>
          <option value="Kore">Kore (명료한 여성)</option>
        </select>
      </div>
    </div>
    <div class="field-group">
      <label for="modelInput">실시간 음성 모델 ID</label>
      <input type="text" id="modelInput" list="liveModelList" value="gemini-2.0-flash-exp" />
      <datalist id="liveModelList">
        <option value="gemini-2.0-flash-exp"></option>
        <option value="gemini-2.0-flash-live-001"></option>
        <option value="gemini-2.5-flash-native-audio-preview-09-2025"></option>
      </datalist>
    </div>
    <div class="field-group">
      <label for="glossaryInput">상황 및 전문 용어집 (선택 입력)</label>
      <textarea id="glossaryInput" placeholder="예: 학술 세미나 또는 해외 거래처 미팅. 고유명사와 전문 용어를 적어두면 음성 통역에 즉시 반영됩니다."></textarea>
    </div>
  </section>

  <main id="transcriptBox" class="transcript-container">
    <div class="bubble system">
      통역 시작을 누르면 스피커에서 AI 통역 음성이 나오는 동안 마이크가 자동으로 일시 정지되어 에코 루프를 차단합니다.<br />
      말씀하시면 즉시 음성으로 통역되고 화면에는 대화 원문과 통역 문자가 기록됩니다.
    </div>
  </main>

  <footer class="controls">
    <div class="mic-gate-row">
      <div class="visualizer-bar">
        <div id="volumeFill" class="visualizer-fill"></div>
      </div>
      <span id="micStateLabel" class="mic-state-label">마이크 대기</span>
    </div>
    <div id="modeStatusBar" class="mode-status-bar" title="탭하면 자동/수동 고정 모드를 바꿀 수 있습니다">
      <span id="modeStatusText">완전 자동 양방향: 한국어 ↔ 영어 즉시 음성통역</span>
      <span class="mode-pill">자동 감지</span>
    </div>
    <div class="btn-row">
      <button id="mainActionBtn" class="btn-main btn-start">통역 시작</button>
      <button id="clearBtn" class="btn-clear">지우기</button>
    </div>
  </footer>

  <script>
    const headerTierBadge = document.getElementById("headerTierBadge");
    const selectFreeTierBtn = document.getElementById("selectFreeTierBtn");
    const selectPaidTierBtn = document.getElementById("selectPaidTierBtn");
    const freeApiKeyInput = document.getElementById("freeApiKeyInput");
    const paidApiKeyInput = document.getElementById("paidApiKeyInput");
    const freeKeyFileInput = document.getElementById("freeKeyFileInput");
    const paidKeyFileInput = document.getElementById("paidKeyFileInput");
    const keyStatusMsg = document.getElementById("keyStatusMsg");

    const partnerLangSelect = document.getElementById("partnerLangSelect");
    const autoModeSelect = document.getElementById("autoModeSelect");
    const echoGuardSelect = document.getElementById("echoGuardSelect");
    const voiceOutputSelect = document.getElementById("voiceOutputSelect");
    const toneSelect = document.getElementById("toneSelect");
    const modelInput = document.getElementById("modelInput");
    const voiceNameSelect = document.getElementById("voiceNameSelect");
    const glossaryInput = document.getElementById("glossaryInput");
    const settingsPanel = document.getElementById("settingsPanel");
    const toggleSettingsBtn = document.getElementById("toggleSettingsBtn");
    const quickLangBtns = document.querySelectorAll(".quick-lang-btn");
    const statusBadge = document.getElementById("statusBadge");
    const transcriptBox = document.getElementById("transcriptBox");
    const copyLogBtn = document.getElementById("copyLogBtn");
    const downloadTxtBtn = document.getElementById("downloadTxtBtn");
    const modeStatusBar = document.getElementById("modeStatusBar");
    const modeStatusText = document.getElementById("modeStatusText");
    const mainActionBtn = document.getElementById("mainActionBtn");
    const clearBtn = document.getElementById("clearBtn");
    const volumeFill = document.getElementById("volumeFill");
    const micStateLabel = document.getElementById("micStateLabel");

    const LANG_NAMES = {
      en: { ko: "영어", en: "English" },
      zh: { ko: "중국어", en: "Mandarin Chinese" },
      ja: { ko: "일본어", en: "Japanese" },
      es: { ko: "스페인어", en: "Spanish" }
    };

    let activeKeyTier = "free";
    let ws = null;
    let isRunning = false;
    let isConnecting = false;
    let isAiSpeaking = false;
    let echoGuardTimer = null;

    function bindKeyFileLoader(fileInputEl, targetTextInputEl, tierType) {
      fileInputEl.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const rawText = (e.target.result || "").trim();
          if (!rawText) {
            keyStatusMsg.style.color = "#f87171";
            keyStatusMsg.textContent = "선택한 파일이 비어 있습니다.";
            return;
          }

          const keyMatch = rawText.match(/AIza[0-9A-Za-z\-_]{30,}/);
          const extractedKey = keyMatch ? keyMatch[0] : rawText.split(/\r?\n/)[0].trim();

          if (!extractedKey) {
            keyStatusMsg.style.color = "#f87171";
            keyStatusMsg.textContent = "파일에서 유효한 API 키를 찾지 못했습니다.";
            return;
          }

          targetTextInputEl.value = extractedKey;
          activeKeyTier = tierType;
          saveSettings();
          updateTierUI();
          keyStatusMsg.style.color = "#34d399";
          keyStatusMsg.textContent = `파일(${file.name})에서 [${tierType === "free" ? "무료 키" : "유료 키"}]를 불러와 적용했습니다.`;
        };

        reader.onerror = () => {
          keyStatusMsg.style.color = "#f87171";
          keyStatusMsg.textContent = "파일을 읽는 중 오류가 발생했습니다.";
        };

        reader.readAsText(file, "UTF-8");
      });
    }

    function getFormattedTime() {

    function getFileTimestamp() {

      return `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}_${String(now.getHours()).padStart(2, "0")}${String(now.getMinutes()).padStart(2, "0")}${String(now.getSeconds()).padStart(2, "0")}`;
    }

    function collectTranscriptText() {
      const bubbles = transcriptBox.querySelectorAll(".bubble:not(.system):not(.error-diag)");
      if (bubbles.length === 0) return "";
      const lines = [];
      bubbles.forEach((b) => {
        const label = b.querySelector(".bubble-label")?.textContent.trim() || "";
        const time = b.querySelector(".bubble-time")?.textContent.trim() || "";
        const content = b.querySelector(".bubble-content")?.textContent.trim() || "";
        if (content) {
          lines.push(time ? `[${time}] ${label}: ${content}` : `[${label}]: ${content}`);
        }
      });
      return lines.join("\n\n");
    }

    copyLogBtn.addEventListener("click", async () => {
      const text = collectTranscriptText();
      if (!text) {
        alert("복사할 대화 기록이 없습니다.");
        return;
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const tempArea = document.createElement("textarea");
          tempArea.value = text;
          tempArea.style.position = "fixed";
          tempArea.style.left = "-9999px";
          document.body.appendChild(tempArea);
          tempArea.select();
          document.execCommand("copy");
          document.body.removeChild(tempArea);
        }
        const origText = copyLogBtn.textContent;
        copyLogBtn.textContent = "복사 완료";
        copyLogBtn.classList.add("success");
        setTimeout(() => {
          copyLogBtn.textContent = origText;

    function unlockAudioPlayback() {
      try {
        if (!outputAudioCtx || outputAudioCtx.state === "closed") {
          outputAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        }
        if (outputAudioCtx.state === "suspended") {
          outputAudioCtx.resume();
        }
        if (!outputGainNode) {
          outputGainNode = outputAudioCtx.createGain();
          outputGainNode.gain.value = 1.35;
          outputGainNode.connect(outputAudioCtx.destination);
        }
        const silentBuf = outputAudioCtx.createBuffer(1, 1, 24000);
        const silentSrc = outputAudioCtx.createBufferSource();
        silentSrc.buffer = silentBuf;
        silentSrc.connect(outputGainNode);
        silentSrc.start(0);
        nextPlayTime = outputAudioCtx.currentTime;
      } catch (e) {
        console.warn("AudioContext 초기화 경고:", e);
      }
    }

    function analyzeCloseReason(code, reason) {
      const r = (reason || "").toLowerCase();
      if (r.includes("not found") || r.includes("bidigeneratecontent") || r.includes("not supported")) {
        return "해결 처방: 설정창의 [실시간 음성 모델 ID]를 목록에 있는 gemini-2.0-flash-exp 또는 gemini-2.5-flash-native-audio-preview-09-2025로 변경해 보세요.";
      }
      if (r.includes("api key") || r.includes("permission") || r.includes("unauthenticated")) {
        return "해결 처방: API 키가 잘못되었거나 만료되었습니다. 설정창에서 키 문자열을 다시 확인하세요.";
      }
      if (r.includes("referer") || r.includes("origin") || r.includes("blocked")) {
        return "해결 처방: Google Cloud Console에서 해당 API 키의 [애플리케이션 제한사항]을 '없음'으로 변경해 주세요.";
      }
      if (r.includes("quota") || r.includes("resource_exhausted") || code === 1011) {
        return "해결 처방: 무료 등급의 분당 사용량 한도를 초과했습니다. 잠시 후 다시 시도하거나 상단 배지를 눌러 [유료 키]로 전환하세요.";
      }
      if (code === 1008) {
        return "해결 처방: 정책 위반(1008) 오류입니다. 설정창의 모델 ID와 API 키 권한을 확인해 주세요.";
      }
      return "해결 처방: 네트워크 연결 상태와 API 키를 다시 한 번 점검해 주세요.";
    }

    function addErrorDiagnosticMessage(code, reason) {
      const div = document.createElement("div");
      div.className = "bubble error-diag";

      const title = document.createElement("div");
      title.className = "error-diag-title";
      title.textContent = `연결 종료 진단 (종료 코드: ${code})`;

      const reasonBox = document.createElement("div");
      reasonBox.className = "error-diag-reason";
      reasonBox.textContent = reason && reason.trim()
        ? `서버 반환 사유: ${reason}`
        : "서버 반환 사유: 상세 메시지 없음";

      const hint = document.createElement("div");
      hint.className = "error-diag-hint";
      hint.textContent = analyzeCloseReason(code, reason);

      div.appendChild(title);
      div.appendChild(reasonBox);
      div.appendChild(hint);
      transcriptBox.appendChild(div);
      transcriptBox.scrollTop = transcriptBox.scrollHeight;
    }

    function createBubbleElement(typeClass, labelText, labelColor = "") {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${typeClass}`;

      const header = document.createElement("div");
      header.className = "bubble-header";

      const label = document.createElement("span");
      label.className = "bubble-label";
      if (labelColor) label.style.color = labelColor;
      label.textContent = labelText;

      const time = document.createElement("span");
      time.className = "bubble-time";
      time.textContent = getFormattedTime();

      header.appendChild(label);
      header.appendChild(time);

      const content = document.createElement("span");
      content.className = "bubble-content";

      bubble.appendChild(header);
      bubble.appendChild(content);
      transcriptBox.appendChild(bubble);
      return bubble;
    }

    function getDynamicRuleText() {
      const partnerCode = partnerLangSelect.value;
      const partnerInfo = LANG_NAMES[partnerCode];
      const mode = autoModeSelect.value;
      const tone = toneSelect.value;

      let toneDesc = "자연스럽고 정중한 존댓말(해요체/하십시오체 및 해당 언어의 공손한 회화체)";
      if (tone === "casual") toneDesc = "자연스럽고 친근한 일상 구어체";
      if (tone === "formal") toneDesc = "비즈니스 협상, 학술 세미나 및 공식 석상에 적합한 격식체";

      if (mode === "auto_both") {
        return [
          `[완전 자동 양방향 동시통역 규칙]`,
          `1. 입력 음성이 한국어(Korean)이면 즉시 ${toneDesc}의 자연스러운 ${partnerInfo.ko}(${partnerInfo.en}) 음성으로 통역하여 말하십시오.`,
          `2. 입력 음성이 영어(English), 중국어(Chinese), 일본어(Japanese), 스페인어(Spanish) 등 외국어이면 즉시 ${toneDesc}의 자연스러운 한국어(Korean) 음성으로 통역하여 말하십시오.`
        ].join("\n");
      } else if (mode === "to_ko_only") {
        return `[듣기 고정 규칙] 입력되는 영어, 중국어, 일본어, 스페인어 음성을 즉시 ${toneDesc}의 한국어(Korean) 음성으로 통역하여 말하십시오.`;
      } else {
        return `[말하기 고정 규칙] 입력되는 한국어(Korean) 음성을 즉시 ${toneDesc}의 ${partnerInfo.ko}(${partnerInfo.en}) 음성으로 통역하여 말하십시오.`;
      }
    }

    function buildSystemInstruction() {

        getDynamicRuleText(),
        "절대 규칙 1: 질문에 대답하거나 잡담을 하지 마십시오. 오직 들린 문장의 통역 결과만을 즉시 음성으로 발화하십시오.",
        "절대 규칙 2: '번역해 드리겠습니다', '네 알겠습니다' 같은 인사말이나 부연 설명을 일절 붙이지 마십시오.",
        "절대 규칙 3: 단어 직역을 피하고 대화의 앞뒤 문맥과 생략된 주어를 살려 원어민처럼 매끄럽게 말하십시오."
      ].join("\n");

      if (glossary) {
        prompt += `\n[상황 및 필수 용어집]\n${glossary}`;
      }
      return prompt;
    }

    function sendRuleUpdateSignal() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        clientContent: {
          turns: [{
            role: "user",
            parts: [{
              text: `${getDynamicRuleText()}\n(이 지시문에는 대답하지 말고 다음 음성 입력부터 즉시 음성으로 통역만 출력하십시오.)`
            }]
          }],
          turnComplete: true
        }
      }));
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (e) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    async function startSession() {
      const apiKey = getActiveApiKey();
      const tierLabel = activeKeyTier === "paid" ? "유료 키" : "무료 키";

      if (!apiKey) {
        alert(`선택된 [${tierLabel}]가 비어 있습니다. 설정창에서 API 키를 입력하거나 파일로 불러와 주세요.`);
        settingsPanel.classList.remove("hidden");
        return;
      }

      saveSettings();
      settingsPanel.classList.add("hidden");
      setStatus("연결 중...", "normal");
      mainActionBtn.disabled = true;
      isConnecting = true;

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: 16000,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        if (outputAudioCtx && outputAudioCtx.state === "suspended") {
          await outputAudioCtx.resume();
        }
        nextPlayTime = outputAudioCtx.currentTime;

        const modelName = modelInput.value.trim() || "gemini-2.0-flash-exp";
        const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(apiKey)}`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          const useVoice = voiceOutputSelect.value === "on";
          const voiceName = voiceNameSelect.value || "Aoede";

          const generationConfig = {
            responseModalities: useVoice ? ["AUDIO"] : ["TEXT"]
          };
          if (useVoice) {
            generationConfig.speechConfig = {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: voiceName
                }
              }
            };
          }

          const setupObj = {
            model: `models/${modelName}`,
            generationConfig: generationConfig,
            systemInstruction: {
              parts: [{ text: buildSystemInstruction() }]
            },
            inputAudioTranscription: {}
          };
          if (useVoice) {
            setupObj.outputAudioTranscription = {};
          }

          ws.send(JSON.stringify({ setup: setupObj }));
          startMicCapture();
          requestWakeLock();

          isConnecting = false;
          isRunning = true;
          isAiSpeaking = false;
          setMicGateVisual(false);
          mainActionBtn.disabled = false;
          mainActionBtn.textContent = "통역 중지";
          mainActionBtn.className = "btn-main btn-stop";
          setStatus("실시간 통역 중", "connected");

          const partnerKoName = LANG_NAMES[partnerLangSelect.value].ko;
          addSystemMessage(`[${tierLabel}] 연결 완료. 한국어 또는 ${partnerKoName}로 말씀하시면 즉시 음성 통역됩니다.`);
        };

        ws.onmessage = async (event) => {
          let rawText = event.data;
          if (rawText instanceof Blob) {
            rawText = await rawText.text();
          }
          const data = JSON.parse(rawText);
          if (data.error) {
            addErrorDiagnosticMessage(data.error.code || "API_ERROR", data.error.message || JSON.stringify(data.error));
            return;
          }
          handleServerMessage(data);
        };

        ws.onerror = () => {
          setStatus("연결 오류", "error");
        };

        ws.onclose = (e) => {
          const wasActive = isRunning || isConnecting;
          const isAbnormal = e.code !== 1000 && e.code !== 1005;
          if (wasActive) {
            if (isAbnormal || e.reason) {
              setStatus(`오류 (${e.code})`, "error");
              addErrorDiagnosticMessage(e.code, e.reason);
            } else {
              addSystemMessage(`통역 세션이 종료되었습니다. (코드: ${e.code})`);
            }
            cleanupResources();
          }
        };

      } catch (err) {
        isConnecting = false;
        mainActionBtn.disabled = false;
        setStatus("마이크 오류", "error");
        alert("마이크 권한 허용이 필요합니다.\n오류 내용: " + err.message);
      }
    }

    function handleServerMessage(data) {
      const serverContent = data.serverContent;
      if (!serverContent) return;

      if (serverContent.interrupted) {
        stopAllPlayingAudio();
        currentTranslatedBubble = null;
        return;
      }

      if (serverContent.inputTranscription && serverContent.inputTranscription.text) {
        appendUserTranscript(serverContent.inputTranscription.text);
      }

      if (serverContent.outputTranscription && serverContent.outputTranscription.text) {
        currentUserBubble = null;
        appendTranslatedText(serverContent.outputTranscription.text);
      }

      if (serverContent.modelTurn && serverContent.modelTurn.parts) {
        currentUserBubble = null;
        for (const part of serverContent.modelTurn.parts) {
          if (part.text) {
            appendTranslatedText(part.text);
          }
          if (part.inlineData && part.inlineData.mimeType && part.inlineData.mimeType.startsWith("audio/pcm")) {
            if (voiceOutputSelect.value === "on") {
              playPcmChunk(part.inlineData.data);
            }
          }
        }
      }

      if (serverContent.turnComplete) {
        currentTranslatedBubble = null;
        currentUserBubble = null;
      }
    }

    function startMicCapture() {
      inputAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = inputAudioCtx.createMediaStreamSource(micStream);
      processorNode = inputAudioCtx.createScriptProcessor(4096, 1, 1);

      processorNode.onaudioprocess = (e) => {
        if (!isRunning || !ws || ws.readyState !== WebSocket.OPEN) return;

        // 스피커 모드에서 AI 음성이 재생 중이면 마이크 데이터 전송을 즉시 차단해 에코 루프 방지
        const blockEcho = echoGuardSelect.value === "speaker" && isAiSpeaking;
        if (blockEcho) {
          return;
        }

        const float32Data = e.inputBuffer.getChannelData(0);

        let sum = 0;
        for (let i = 0; i < float32Data.length; i++) {
          sum += float32Data[i] * float32Data[i];
        }
        const rms = Math.sqrt(sum / float32Data.length);
        const level = Math.min(100, Math.round(rms * 450));
        volumeFill.style.width = level + "%";

        const int16Buffer = new Int16Array(float32Data.length);
        for (let i = 0; i < float32Data.length; i++) {
          const s = Math.max(-1, Math.min(1, float32Data[i]));
          int16Buffer[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        const base64Audio = arrayBufferToBase64(int16Buffer.buffer);

        ws.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{
              mimeType: "audio/pcm;rate=16000",
              data: base64Audio
            }]
          }
        }));
      };

      source.connect(processorNode);
      processorNode.connect(inputAudioCtx.destination);
    }

    function playPcmChunk(base64Data) {
      if (!outputAudioCtx) return;
      if (outputAudioCtx.state === "suspended") {
        outputAudioCtx.resume();
      }

      if (echoGuardTimer) {
        clearTimeout(echoGuardTimer);
        echoGuardTimer = null;
      }

      isAiSpeaking = true;
      if (echoGuardSelect.value === "speaker") {
        setMicGateVisual(true);
        setStatus("음성 송출 중 (에코 차단)", "speaking");
      } else {
        setStatus("통역 음성 출력 중", "speaking");
      }

      const arrayBuffer = base64ToArrayBuffer(base64Data);
      const int16Array = new Int16Array(arrayBuffer);
      const float32Array = new Float32Array(int16Array.length);

      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768.0;
      }

      const audioBuffer = outputAudioCtx.createBuffer(1, float32Array.length, 24000);
      audioBuffer.getChannelData(0).set(float32Array);

      const source = outputAudioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(outputGainNode || outputAudioCtx.destination);

      const startTime = Math.max(outputAudioCtx.currentTime, nextPlayTime);
      source.start(startTime);
      nextPlayTime = startTime + audioBuffer.duration;

      activeSources.push(source);
      source.onended = () => {
        activeSources = activeSources.filter(s => s !== source);
        if (activeSources.length === 0) {
          // 마지막 음성 조각 재생 완료 후 실내 잔향 흡수를 위해 0.45초 뒤 마이크 재개
          echoGuardTimer = setTimeout(() => {
            isAiSpeaking = false;
            echoGuardTimer = null;
            if (isRunning) {
              setMicGateVisual(false);
              setStatus("실시간 통역 중", "connected");
            }
          }, 450);
        }
      };
    }

    function stopAllPlayingAudio() {
      if (echoGuardTimer) {
        clearTimeout(echoGuardTimer);
        echoGuardTimer = null;
      }
      for (const src of activeSources) {
        try { src.stop(); } catch (e) {}
      }
      activeSources = [];
      isAiSpeaking = false;
      if (outputAudioCtx) {
        nextPlayTime = outputAudioCtx.currentTime;
      }
      if (isRunning) {
        setMicGateVisual(false);
        setStatus("실시간 통역 중", "connected");
      }
    }

    function cleanupResources() {
      isRunning = false;
      isConnecting = false;
      releaseWakeLock();
      stopAllPlayingAudio();
      setMicGateVisual(false);

      if (processorNode) {
        processorNode.disconnect();
        processorNode = null;
      }
      if (inputAudioCtx) {
        inputAudioCtx.close().catch(() => {});
        inputAudioCtx = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }

      mainActionBtn.disabled = false;
      mainActionBtn.textContent = "통역 시작";
      mainActionBtn.className = "btn-main btn-start";
    }

    function stopSession() {
      cleanupResources();
      if (ws) {
        if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
          ws.close(1000, "User stopped");
        }
        ws = null;
      }
      setStatus("대기 중", "normal");
    }

    function arrayBufferToBase64(buffer) {
      let binary = "";
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }
  </script>
