<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230284c7'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E譯%3C/text%3E%3C/svg%3E" />
  <title>AI 무중단 양방향 실시간 음성통역기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      background-color: #1e293b;
      padding: 11px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    .header-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tier-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      background-color: #1e3a8a;
      color: #93c5fd;
      border: 1px solid #2563eb;
      cursor: pointer;
    }
    .tier-badge.paid {
      background-color: #78350f;
      color: #fcd34d;
      border-color: #d97706;
    }
    .status-badge {
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 999px;
      background-color: #334155;
      color: #cbd5e1;
      font-weight: 600;
    }
    .status-badge.connected {
      background-color: #065f46;
      color: #6ee7b7;
    }
    .status-badge.speaking {
      background-color: #9a3412;
      color: #fed7aa;
    }
    .status-badge.renewing {
      background-color: #4338ca;
      color: #c7d2fe;
    }
    .status-badge.error {
      background-color: #7f1d1d;
      color: #fca5a5;
    }
    .settings-toggle {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .quick-lang-bar {
      background-color: #1e293b;
      padding: 8px 12px;
      border-bottom: 1px solid #334155;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .quick-lang-btn {
      background-color: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .quick-lang-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
    }
    .log-toolbar {
      background-color: #162032;
      padding: 6px 12px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .log-toolbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .session-timer-badge {
      font-size: 11px;
      font-family: monospace;
      color: #38bdf8;
      background-color: #0f172a;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    .log-toolbar-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn-tool {
      background-color: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-tool.summary-btn {
      background-color: #4338ca;
      border-color: #6366f1;
      color: #e0e7ff;
    }
    .btn-tool.share-btn {
      background-color: #0369a1;
      border-color: #0284c7;
      color: #e0f2fe;
    }
    .btn-tool.summary-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .btn-tool.success {
      background-color: #065f46;
      border-color: #10b981;
      color: #6ee7b7;
    }
    .settings-panel {
      background-color: #1e293b;
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 64dvh;
      overflow-y: auto;
    }
    .settings-panel.hidden {
      display: none;
    }
    .tier-selector-box {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tier-switch-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .tier-choice-btn {
      padding: 9px 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .tier-choice-btn.active-free {
      background-color: #1d4ed8;
      border-color: #60a5fa;
      color: #ffffff;
    }
    .tier-choice-btn.active-paid {
      background-color: #b45309;
      border-color: #fbbf24;
      color: #ffffff;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-group label {
      font-size: 12px;
      color: #94a3b8;
    }
    .field-group input, .field-group select, .field-group textarea {
      background-color: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    .field-group textarea {
      resize: vertical;
      min-height: 48px;
    }
    .api-key-row {
      display: flex;
      gap: 5px;
      align-items: stretch;
    }
    .api-key-row input[type="password"],
    .api-key-row input[type="text"] {
      flex: 1;
      min-width: 0;
      font-size: 13px;
    }
    .btn-file-load {
      background-color: #0369a1;
      color: #ffffff;
      border: 1px solid #0284c7;
      padding: 0 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-key-toggle {
      background-color: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .key-status-msg {
      font-size: 11px;
      color: #34d399;
      min-height: 15px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .transcript-container {
      flex: 1;
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 16px;
      word-break: keep-all;
      animation: fadeIn 0.2s ease;
    }
    .bubble.system {
      background-color: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
    }
    .bubble.error-diag {
      background-color: #450a0a;
      border: 1px solid #dc2626;
      border-left: 4px solid #ef4444;
      color: #fecaca;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }
    .error-diag-title {
      font-weight: 700;
      color: #fca5a5;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .error-diag-reason {
      background-color: #1f0505;
      padding: 6px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      color: #fda4af;
      margin: 6px 0;
      white-space: pre-wrap;
    }
    .error-diag-hint {
      color: #fef08a;
      font-size: 12px;
      margin-top: 4px;
    }
    .bubble.user-speech {
      background-color: #1e293b;
      border-left: 3px solid #64748b;
      color: #cbd5e1;
      font-size: 14px;
    }
    .bubble.translated-out {
      background-color: #172554;
      border-left: 4px solid #38bdf8;
      color: #ffffff;
      font-size: 18px;
      font-weight: 500;
    }
    .bubble.summary-card {
      background-color: #1e1b4b;
      border: 1px solid #4f46e5;
      border-left: 4px solid #818cf8;
      color: #f8fafc;
      font-size: 14px;
      line-height: 1.65;
    }
    .bubble.summary-card .bubble-content {
      display: block;
      white-space: pre-wrap;
    }
    .summary-card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(129, 140, 248, 0.35);
    }
    .btn-summary-copy {
      background-color: #312e81;
      color: #e0e7ff;
      border: 1px solid #6366f1;
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .btn-summary-copy:active {
      background-color: #3730a3;
    }
    .btn-summary-copy.foreign {
      background-color: #064e3b;
      color: #d1fae5;
      border-color: #10b981;
    }
    .btn-summary-copy.copied {
      background-color: #065f46 !important;
      border-color: #34d399 !important;
      color: #ffffff !important;
    }
    .bubble-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .bubble-label {
      font-size: 11px;
      color: #7dd3fc;
      font-weight: 600;
    }
    .bubble.summary-card .bubble-label {
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 700;
    }
    .bubble-time {
      font-size: 10px;
      color: #64748b;
    }
    .controls {
      background-color: #1e293b;
      padding: 10px 16px 18px 16px;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .mic-gate-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .visualizer-bar {
      flex: 1;
      height: 6px;
      background-color: #0f172a;
      border-radius: 3px;
      overflow: hidden;
    }
    .visualizer-fill {
      height: 100%;
      width: 0%;
      background-color: #38bdf8;
      transition: width 0.08s linear, background-color 0.15s;
    }
    .visualizer-fill.muted {
      width: 100% !important;
      background-color: #f97316;
    }
    .mic-state-label {
      font-size: 11px;
      color: #94a3b8;
      min-width: 78px;
      text-align: right;
      font-weight: 600;
    }
    .mic-state-label.muted {
      color: #fb923c;
    }
    .mode-status-bar {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #0284c7;
      background-color: #0f172a;
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .mode-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background-color: #0369a1;
      color: #ffffff;
    }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-main {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-start {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-stop {
      background-color: #dc2626;
      color: #ffffff;
    }
    .btn-clear {
      padding: 0 16px;
      background-color: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>AI 실시간 음성 동시통역</h1>
      <div class="header-sub">무중단 자동갱신 · 이중언어 회의록 · 즉시공유</div>
    </div>
    <div class="header-right">
      <span id="headerTierBadge" class="tier-badge">무료 키</span>
      <span id="statusBadge" class="status-badge">대기 중</span>
      <button id="toggleSettingsBtn" class="settings-toggle">설정</button>
    </div>
  </header>

  <nav id="quickLangBar" class="quick-lang-bar" aria-label="상대방 언어 빠른 선택">
    <button type="button" class="quick-lang-btn active" data-lang="en">영어</button>
    <button type="button" class="quick-lang-btn" data-lang="zh">중국어</button>
    <button type="button" class="quick-lang-btn" data-lang="ja">일본어</button>
    <button type="button" class="quick-lang-btn" data-lang="es">스페인어</button>
  </nav>

  <div class="log-toolbar">
    <div class="log-toolbar-left">
      <span id="sessionTimerBadge" class="session-timer-badge" title="현재 세션 경과 시간 (12분마다 자동 갱신)">00:00</span>
    </div>
    <div class="log-toolbar-actions">
      <button id="summarizeBtn" class="btn-tool summary-btn" type="button">이중언어 요약</button>
      <button id="shareLogBtn" class="btn-tool share-btn" type="button">공유하기</button>
      <button id="copyLogBtn" class="btn-tool" type="button">복사</button>
      <button id="downloadTxtBtn" class="btn-tool" type="button">TXT 저장</button>
    </div>
  </div>

  <section id="settingsPanel" class="settings-panel">
    <div class="tier-selector-box">
      <div style="font-size: 12px; color: #cbd5e1; font-weight: 600;">사용할 API 키 등급 원터치 선택</div>
      <div class="tier-switch-grid">
        <button type="button" id="selectFreeTierBtn" class="tier-choice-btn active-free">일상용 무료 키 사용</button>
        <button type="button" id="selectPaidTierBtn" class="tier-choice-btn">미팅·학술 유료 키 사용</button>
      </div>

      <div class="field-group">
        <label for="freeApiKeyInput">1. 일상용 무료 API 키 (Free Tier)</label>
        <div class="api-key-row">
          <input type="password" id="freeApiKeyInput" placeholder="무료 프로젝트 AIzaSy..." />
          <button type="button" class="btn-key-toggle" data-target="freeApiKeyInput">표시</button>
          <button type="button" class="btn-file-load" data-file-target="freeKeyFileInput">파일</button>
          <input type="file" id="freeKeyFileInput" accept=".txt,.env,.json,text/plain" style="display: none;" />
        </div>
      </div>

      <div class="field-group">
        <label for="paidApiKeyInput">2. 미팅·학술용 유료 API 키 (결제 연결 프로젝트)</label>
        <div class="api-key-row">
          <input type="password" id="paidApiKeyInput" placeholder="유료 프로젝트 AIzaSy..." />
          <button type="button" class="btn-key-toggle" data-target="paidApiKeyInput">표시</button>
          <button type="button" class="btn-file-load" data-file-target="paidKeyFileInput">파일</button>
          <input type="file" id="paidKeyFileInput" accept=".txt,.env,.json,text/plain" style="display: none;" />
        </div>
      </div>

      <div id="keyStatusMsg" class="key-status-msg"></div>
    </div>

    <div class="row-2">
      <div class="field-group">
        <label for="partnerLangSelect">상대방 언어</label>
        <select id="partnerLangSelect">
          <option value="en">영어 (English)</option>
          <option value="zh">중국어 (中文/普通话)</option>
          <option value="ja">일본어 (日本語)</option>
          <option value="es">스페인어 (Español)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="autoModeSelect">통역 작동 방식</label>
        <select id="autoModeSelect">
          <option value="auto_both">완전 자동 양방향 (누를 필요 없음)</option>
          <option value="to_ko_only">상대방 말 듣기 고정 (외국어→한국어)</option>
          <option value="from_ko_only">내 말 전달 고정 (한국어→외국어)</option>
        </select>
      </div>
    </div>
    <div class="row-2">
      <div class="field-group">
        <label for="echoGuardSelect">오디오 환경 및 에코 차단</label>
        <select id="echoGuardSelect">
          <option value="speaker">스피커 모드 (음성 출력 중 마이크 자동 차단)</option>
          <option value="earphone">이어폰 모드 (동시 송수신 허용)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="autoRenewSelect">장시간 무중단 세션 갱신</label>
        <select id="autoRenewSelect">
          <option value="on">12분마다 자동 갱신 (15분 제한 방지)</option>
          <option value="off">자동 갱신 끄기</option>
        </select>
      </div>
    </div>
    <div class="row-2">
      <div class="field-group">
        <label for="voiceOutputSelect">음성 출력 설정</label>
        <select id="voiceOutputSelect">
          <option value="on">즉시 음성 출력 + 화면 문자 기록</option>
          <option value="off">무음 모드 (화면 문자만 기록)</option>
        </select>
      </div>
      <div class="field-group">
        <label for="toneSelect">통역 어투</label>
        <select id="toneSelect">
          <option value="polite">자연스러운 존댓말/정중체</option>
          <option value="casual">구어체/친근한 대화</option>
          <option value="formal">격식체 (비즈니스/학술)</option>
        </select>
      </div>
    </div>
    <div class="row-2">
      <div class="field-group">
        <label for="modelInput">실시간 음성 모델 ID</label>
        <input type="text" id="modelInput" list="liveModelList" value="gemini-2.0-flash-exp" />
        <datalist id="liveModelList">
          <option value="gemini-2.0-flash-exp"></option>
          <option value="gemini-2.0-flash-live-001"></option>
          <option value="gemini-2.5-flash-native-audio-preview-09-2025"></option>
        </datalist>
      </div>
      <div class="field-group">
        <label for="voiceNameSelect">AI 통역사 목소리</label>
        <select id="voiceNameSelect">
          <option value="Aoede">Aoede (차분한 여성)</option>
          <option value="Puck">Puck (경쾌한 남성)</option>
          <option value="Charon">Charon (중후한 남성)</option>
          <option value="Kore">Kore (명료한 여성)</option>
        </select>
      </div>
    </div>
    <div class="field-group">
      <label for="glossaryInput">상황 및 전문 용어집 (선택 입력)</label>
      <textarea id="glossaryInput" placeholder="예: 학술 세미나 또는 해외 거래처 미팅. 고유명사와 전문 용어를 적어두면 음성 통역과 이중 언어 회의록 요약에 모두 반영됩니다."></textarea>
    </div>
  </section>

  <main id="transcriptBox" class="transcript-container">
    <div class="bubble system">
      통역 시작을 누르면 실시간 양방향 음성 통역과 대화 기록이 시작됩니다.<br />
      이중언어 요약 버튼을 누르면 한국어 요약본과 상대방 언어 요약본이 생성되며, 카드 하단 버튼으로 각 언어 요약만 따로 복사할 수 있습니다.
    </div>
  </main>

  <footer class="controls">
    <div class="mic-gate-row">
      <div class="visualizer-bar">
        <div id="volumeFill" class="visualizer-fill"></div>
      </div>
      <span id="micStateLabel" class="mic-state-label">마이크 대기</span>
    </div>
    <div id="modeStatusBar" class="mode-status-bar" title="탭하면 자동/수동 고정 모드를 바꿀 수 있습니다">
      <span id="modeStatusText">완전 자동 양방향: 한국어 ↔ 영어 즉시 음성통역</span>
      <span class="mode-pill">자동 감지</span>
    </div>
    <div class="btn-row">
      <button id="mainActionBtn" class="btn-main btn-start">통역 시작</button>
      <button id="clearBtn" class="btn-clear">지우기</button>
    </div>
  </footer>

  <script>
    const headerTierBadge = document.getElementById("headerTierBadge");
    const selectFreeTierBtn = document.getElementById("selectFreeTierBtn");
    const selectPaidTierBtn = document.getElementById("selectPaidTierBtn");
    const freeApiKeyInput = document.getElementById("freeApiKeyInput");
    const paidApiKeyInput = document.getElementById("paidApiKeyInput");
    const freeKeyFileInput = document.getElementById("freeKeyFileInput");
    const paidKeyFileInput = document.getElementById("paidKeyFileInput");
    const keyStatusMsg = document.getElementById("keyStatusMsg");

    const partnerLangSelect = document.getElementById("partnerLangSelect");
    const autoModeSelect = document.getElementById("autoModeSelect");
    const echoGuardSelect = document.getElementById("echoGuardSelect");
    const autoRenewSelect = document.getElementById("autoRenewSelect");
    const voiceOutputSelect = document.getElementById("voiceOutputSelect");
    const toneSelect = document.getElementById("toneSelect");
    const modelInput = document.getElementById("modelInput");
    const voiceNameSelect = document.getElementById("voiceNameSelect");
    const glossaryInput = document.getElementById("glossaryInput");
    const settingsPanel = document.getElementById("settingsPanel");
    const toggleSettingsBtn = document.getElementById("toggleSettingsBtn");
    const quickLangBtns = document.querySelectorAll(".quick-lang-btn");
    const statusBadge = document.getElementById("statusBadge");
    const sessionTimerBadge = document.getElementById("sessionTimerBadge");
    const transcriptBox = document.getElementById("transcriptBox");
    const summarizeBtn = document.getElementById("summarizeBtn");
    const shareLogBtn = document.getElementById("shareLogBtn");
    const copyLogBtn = document.getElementById("copyLogBtn");
    const downloadTxtBtn = document.getElementById("downloadTxtBtn");
    const modeStatusBar = document.getElementById("modeStatusBar");
    const modeStatusText = document.getElementById("modeStatusText");
    const mainActionBtn = document.getElementById("mainActionBtn");
    const clearBtn = document.getElementById("clearBtn");
    const volumeFill = document.getElementById("volumeFill");
    const micStateLabel = document.getElementById("micStateLabel");

    const LANG_NAMES = {
      en: { ko: "영어", en: "English", native: "English" },
      zh: { ko: "중국어", en: "Mandarin Chinese", native: "中文" },
      ja: { ko: "일본어", en: "Japanese", native: "日本語" },
      es: { ko: "스페인어", en: "Spanish", native: "Español" }
    };

    const AUTO_RENEW_SECONDS = 720;

    let activeKeyTier = "free";
    let ws = null;
    let isRunning = false;
    let isConnecting = false;
    let isRenewing = false;
    let renewalPending = false;
    let isAiSpeaking = false;
    let echoGuardTimer = null;
    let sessionInterval = null;
    let sessionElapsedSec = 0;
    let totalElapsedSec = 0;
    let reconnectAttemptCount = 0;

    let micStream = null;
    let inputAudioCtx = null;
    let processorNode = null;
    let outputAudioCtx = null;
    let outputGainNode = null;
    let nextPlayTime = 0;
    let activeSources = [];
    let wakeLock = null;
    let currentTranslatedBubble = null;
    let currentUserBubble = null;

    window.addEventListener("DOMContentLoaded", () => {
      const legacyKey = localStorage.getItem("gemini_rt_api_key");
      const savedFreeKey = localStorage.getItem("gemini_rt_free_key") || legacyKey || "";
      const savedPaidKey = localStorage.getItem("gemini_rt_paid_key") || "";
      const savedTier = localStorage.getItem("gemini_rt_active_tier") || "free";

      const savedPartner = localStorage.getItem("gemini_rt_partner_lang");
      const savedAutoMode = localStorage.getItem("gemini_rt_auto_mode");
      const savedEchoGuard = localStorage.getItem("gemini_rt_echo_guard");
      const savedAutoRenew = localStorage.getItem("gemini_rt_auto_renew");
      const savedVoiceOut = localStorage.getItem("gemini_rt_voice_out");
      const savedTone = localStorage.getItem("gemini_rt_tone");
      const savedModel = localStorage.getItem("gemini_rt_model");
      const savedVoiceName = localStorage.getItem("gemini_rt_voice_name");
      const savedGlossary = localStorage.getItem("gemini_rt_glossary");

      freeApiKeyInput.value = savedFreeKey;
      paidApiKeyInput.value = savedPaidKey;
      activeKeyTier = savedTier === "paid" ? "paid" : "free";

      if (savedFreeKey || savedPaidKey) {
        settingsPanel.classList.add("hidden");
      }
      if (savedPartner) partnerLangSelect.value = savedPartner;
      if (savedAutoMode) autoModeSelect.value = savedAutoMode;
      if (savedEchoGuard) echoGuardSelect.value = savedEchoGuard;
      if (savedAutoRenew) autoRenewSelect.value = savedAutoRenew;
      if (savedVoiceOut) voiceOutputSelect.value = savedVoiceOut;
      if (savedTone) toneSelect.value = savedTone;
      if (savedModel) modelInput.value = savedModel;
      if (savedVoiceName) voiceNameSelect.value = savedVoiceName;
      if (savedGlossary) glossaryInput.value = savedGlossary;

      updateTierUI();
      syncQuickLangUI(partnerLangSelect.value);
      updateModeStatusUI();
    });

    function saveSettings() {
      localStorage.setItem("gemini_rt_free_key", freeApiKeyInput.value.trim());
      localStorage.setItem("gemini_rt_paid_key", paidApiKeyInput.value.trim());
      localStorage.setItem("gemini_rt_active_tier", activeKeyTier);
      localStorage.setItem("gemini_rt_partner_lang", partnerLangSelect.value);
      localStorage.setItem("gemini_rt_auto_mode", autoModeSelect.value);
      localStorage.setItem("gemini_rt_echo_guard", echoGuardSelect.value);
      localStorage.setItem("gemini_rt_auto_renew", autoRenewSelect.value);
      localStorage.setItem("gemini_rt_voice_out", voiceOutputSelect.value);
      localStorage.setItem("gemini_rt_tone", toneSelect.value);
      localStorage.setItem("gemini_rt_model", modelInput.value.trim());
      localStorage.setItem("gemini_rt_voice_name", voiceNameSelect.value);
      localStorage.setItem("gemini_rt_glossary", glossaryInput.value.trim());
    }

    function updateTierUI() {
      if (activeKeyTier === "free") {
        selectFreeTierBtn.classList.add("active-free");
        selectPaidTierBtn.classList.remove("active-paid");
        headerTierBadge.textContent = "무료 키";
        headerTierBadge.classList.remove("paid");
        keyStatusMsg.style.color = "#60a5fa";
        keyStatusMsg.textContent = freeApiKeyInput.value.trim()
          ? "현재 [일상용 무료 키]가 선택되어 있습니다."
          : "일상용 무료 키를 입력하거나 파일로 불러와 주세요.";
      } else {
        selectPaidTierBtn.classList.add("active-paid");
        selectFreeTierBtn.classList.remove("active-free");
        headerTierBadge.textContent = "유료 키";
        headerTierBadge.classList.add("paid");
        keyStatusMsg.style.color = "#fbbf24";
        keyStatusMsg.textContent = paidApiKeyInput.value.trim()
          ? "현재 [미팅·학술용 유료 키]가 선택되어 있습니다."
          : "미팅·학술용 유료 키를 입력하거나 파일로 불러와 주세요.";
      }
    }

    function switchKeyTier(newTier) {
      if (activeKeyTier === newTier) return;
      activeKeyTier = newTier;
      saveSettings();
      updateTierUI();

      if (isRunning) {
        addSystemMessage(`API 키 등급이 [${newTier === "free" ? "무료 키" : "유료 키"}]로 변경되었습니다. 새 키로 무중단 전환합니다.`);
        triggerSeamlessRenewal("등급 전환");
      }
    }

    selectFreeTierBtn.addEventListener("click", () => switchKeyTier("free"));
    selectPaidTierBtn.addEventListener("click", () => switchKeyTier("paid"));
    headerTierBadge.addEventListener("click", () => settingsPanel.classList.remove("hidden"));

    freeApiKeyInput.addEventListener("input", () => {
      saveSettings();
      if (activeKeyTier === "free") updateTierUI();
    });

    paidApiKeyInput.addEventListener("input", () => {
      saveSettings();
      if (activeKeyTier === "paid") updateTierUI();
    });

    document.querySelectorAll(".btn-key-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const targetInput = document.getElementById(btn.dataset.target);
        if (!targetInput) return;
        if (targetInput.type === "password") {
          targetInput.type = "text";
          btn.textContent = "숨김";
        } else {
          targetInput.type = "password";
          btn.textContent = "표시";
        }
      });
    });

    document.querySelectorAll(".btn-file-load").forEach((btn) => {
      btn.addEventListener("click", () => {
        const fileInput = document.getElementById(btn.dataset.fileTarget);
        if (fileInput) {
          fileInput.value = "";
          fileInput.click();
        }
      });
    });

    function bindKeyFileLoader(fileInputEl, targetTextInputEl, tierType) {
      fileInputEl.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const rawText = (e.target.result || "").trim();
          if (!rawText) {
            keyStatusMsg.style.color = "#f87171";
            keyStatusMsg.textContent = "선택한 파일이 비어 있습니다.";
            return;
          }

          const keyMatch = rawText.match(/AIza[0-9A-Za-z\-_]{30,}/);
          const extractedKey = keyMatch ? keyMatch[0] : rawText.split(/\r?\n/)[0].trim();

          if (!extractedKey) {
            keyStatusMsg.style.color = "#f87171";
            keyStatusMsg.textContent = "파일에서 유효한 API 키를 찾지 못했습니다.";
            return;
          }

          targetTextInputEl.value = extractedKey;
          activeKeyTier = tierType;
          saveSettings();
          updateTierUI();
          keyStatusMsg.style.color = "#34d399";
          keyStatusMsg.textContent = `파일(${file.name})에서 [${tierType === "free" ? "무료 키" : "유료 키"}]를 불러와 적용했습니다.`;
        };

        reader.onerror = () => {
          keyStatusMsg.style.color = "#f87171";
          keyStatusMsg.textContent = "파일을 읽는 중 오류가 발생했습니다.";
        };

        reader.readAsText(file, "UTF-8");
      });
    }

    bindKeyFileLoader(freeKeyFileInput, freeApiKeyInput, "free");
    bindKeyFileLoader(paidKeyFileInput, paidApiKeyInput, "paid");

    function getActiveApiKey() {
      return activeKeyTier === "paid"
        ? paidApiKeyInput.value.trim()
        : freeApiKeyInput.value.trim();
    }

    function syncQuickLangUI(langCode) {
      quickLangBtns.forEach((btn) => {
        if (btn.dataset.lang === langCode) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });
    }

    function selectPartnerLanguage(langCode) {
      if (!LANG_NAMES[langCode]) return;
      partnerLangSelect.value = langCode;
      syncQuickLangUI(langCode);
      saveSettings();
      updateModeStatusUI();

      if (isRunning) {
        stopAllPlayingAudio();
        currentTranslatedBubble = null;
        currentUserBubble = null;
        sendRuleUpdateSignal();
        const partnerKoName = LANG_NAMES[langCode].ko;
        addSystemMessage(`상대방 언어가 [${partnerKoName}]로 즉시 전환되었습니다.`);
      }
    }

    quickLangBtns.forEach((btn) => {
      btn.addEventListener("click", () => selectPartnerLanguage(btn.dataset.lang));
    });

    partnerLangSelect.addEventListener("change", () => selectPartnerLanguage(partnerLangSelect.value));
    echoGuardSelect.addEventListener("change", () => saveSettings());
    autoRenewSelect.addEventListener("change", () => saveSettings());

    autoModeSelect.addEventListener("change", () => {
      saveSettings();
      updateModeStatusUI();
      if (isRunning) {
        sendRuleUpdateSignal();
      }
    });

    modeStatusBar.addEventListener("click", () => {
      const order = ["auto_both", "to_ko_only", "from_ko_only"];
      const nextIdx = (order.indexOf(autoModeSelect.value) + 1) % order.length;
      autoModeSelect.value = order[nextIdx];
      saveSettings();
      updateModeStatusUI();
      if (isRunning) {
        sendRuleUpdateSignal();
        addSystemMessage(`통역 작동 방식 변경: ${modeStatusText.textContent}`);
      }
    });

    function updateModeStatusUI() {
      const partnerKoName = LANG_NAMES[partnerLangSelect.value].ko;
      const mode = autoModeSelect.value;
      const pill = modeStatusBar.querySelector(".mode-pill");

      if (mode === "auto_both") {
        modeStatusText.textContent = `완전 자동 양방향: 한국어 ↔ ${partnerKoName} 즉시 음성통역`;
        pill.textContent = "자동 감지";
      } else if (mode === "to_ko_only") {
        modeStatusText.textContent = `듣기 고정: ${partnerKoName}(외국어) → 한국어 음성통역`;
        pill.textContent = "듣기 고정";
      } else {
        modeStatusText.textContent = `말하기 고정: 한국어 → ${partnerKoName} 음성통역`;
        pill.textContent = "말하기 고정";
      }
    }

    function formatDuration(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function startSessionTimer() {
      stopSessionTimer();
      sessionElapsedSec = 0;
      totalElapsedSec = 0;
      sessionTimerBadge.textContent = "00:00";

      sessionInterval = setInterval(() => {
        if (!isRunning) return;
        sessionElapsedSec += 1;
        totalElapsedSec += 1;
        sessionTimerBadge.textContent = formatDuration(totalElapsedSec);

        if (autoRenewSelect.value === "on" && sessionElapsedSec >= AUTO_RENEW_SECONDS && !isRenewing) {
          if (!isAiSpeaking && activeSources.length === 0) {
            triggerSeamlessRenewal("12분 주기 자동 갱신");
          } else {
            renewalPending = true;
          }
        }
      }, 1000);
    }

    function stopSessionTimer() {
      if (sessionInterval) {
        clearInterval(sessionInterval);
        sessionInterval = null;
      }
    }

    function getRecentConversationSummary() {
      const bubbles = Array.from(transcriptBox.querySelectorAll(".bubble:not(.system):not(.error-diag):not(.summary-card)"));
      if (bubbles.length === 0) return "";
      const recent = bubbles.slice(-6);
      const lines = recent.map((b) => {
        const label = b.querySelector(".bubble-label")?.textContent.trim() || "";
        const content = b.querySelector(".bubble-content")?.textContent.trim() || "";
        return content ? `${label}: ${content}` : "";
      }).filter(Boolean);
      return lines.join("\n");
    }

    function triggerSeamlessRenewal(reasonLabel = "자동 갱신") {
      if (!isRunning || isRenewing) return;
      isRenewing = true;
      renewalPending = false;
      currentTranslatedBubble = null;
      currentUserBubble = null;
      setStatus("세션 무중단 갱신", "renewing");

      const recentContext = getRecentConversationSummary();

      if (ws) {
        try {
          ws.close(1000, "Seamless renewal");
        } catch (e) {}
        ws = null;
      }

      setTimeout(() => {
        if (!isRunning) {
          isRenewing = false;
          return;
        }
        connectWebSocket(true, recentContext, reasonLabel);
      }, 180);
    }

    function setMicGateVisual(muted) {
      if (!isRunning) {
        volumeFill.classList.remove("muted");
        volumeFill.style.width = "0%";
        micStateLabel.classList.remove("muted");
        micStateLabel.textContent = "마이크 대기";
        return;
      }
      if (muted) {
        volumeFill.classList.add("muted");
        micStateLabel.classList.add("muted");
        micStateLabel.textContent = "에코 차단 중";
      } else {
        volumeFill.classList.remove("muted");
        micStateLabel.classList.remove("muted");
        micStateLabel.textContent = "음성 수신 중";
      }
    }

    function getFormattedTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`;
    }

    function getFileTimestamp() {
      const now = new Date();
      return `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}_${String(now.getHours()).padStart(2, "0")}${String(now.getMinutes()).padStart(2, "0")}${String(now.getSeconds()).padStart(2, "0")}`;
    }

    function collectDialogueOnlyText() {
      const bubbles = transcriptBox.querySelectorAll(".bubble:not(.system):not(.error-diag):not(.summary-card)");
      if (bubbles.length === 0) return "";
      const lines = [];
      bubbles.forEach((b) => {
        const label = b.querySelector(".bubble-label")?.textContent.trim() || "";
        const time = b.querySelector(".bubble-time")?.textContent.trim() || "";
        const content = b.querySelector(".bubble-content")?.textContent.trim() || "";
        if (content) {
          lines.push(time ? `[${time}] ${label}: ${content}` : `[${label}]: ${content}`);
        }
      });
      return lines.join("\n\n");
    }

    function collectFullExportText() {
      const dialogueText = collectDialogueOnlyText();
      const summaryCards = transcriptBox.querySelectorAll(".bubble.summary-card");
      if (!dialogueText && summaryCards.length === 0) return "";

      let exportParts = [];
      if (summaryCards.length > 0) {
        const latestSummary = summaryCards[summaryCards.length - 1];
        const summaryContent = latestSummary.querySelector(".bubble-content")?.textContent.trim() || "";
        if (summaryContent) {
          exportParts.push(`[AI 이중 언어 회의록 요약]\n${summaryContent}`);
        }
      }
      if (dialogueText) {
        exportParts.push(`[전체 통역 대화 녹취록]\n${dialogueText}`);
      }
      return exportParts.join("\n\n========================================\n\n");
    }

    async function copyTextFallback(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const tempArea = document.createElement("textarea");
        tempArea.value = text;
        tempArea.style.position = "fixed";
        tempArea.style.left = "-9999px";
        document.body.appendChild(tempArea);
        tempArea.select();
        document.execCommand("copy");
        document.body.removeChild(tempArea);
      }
    }

    function splitBilingualSummary(fullSummaryText, partnerNativeLabel) {
      const dividerRegex = /\n\s*-{10,}\s*\n/;
      if (dividerRegex.test(fullSummaryText)) {
        const parts = fullSummaryText.split(dividerRegex);
        return {
          koPart: parts[0].trim(),
          foreignPart: parts.slice(1).join("\n\n").trim()
        };
      }
      const marker = `[${partnerNativeLabel} Meeting Summary]`;
      const idx = fullSummaryText.indexOf(marker);
      if (idx !== -1) {
        return {
          koPart: fullSummaryText.slice(0, idx).trim(),
          foreignPart: fullSummaryText.slice(idx).trim()
        };
      }
      return {
        koPart: fullSummaryText.trim(),
        foreignPart: fullSummaryText.trim()
      };
    }

    // 이중 언어 AI 회의록 요약 생성 기능 (한국어 + 선택한 상대방 언어 나란히 생성 및 개별 복사 버튼 제공)
    summarizeBtn.addEventListener("click", async () => {
      const dialogueText = collectDialogueOnlyText();
      if (!dialogueText) {
        alert("요약할 대화 기록이 화면에 없습니다. 먼저 통역을 진행해 주세요.");
        return;
      }

      const apiKey = getActiveApiKey();
      if (!apiKey) {
        alert("API 키가 설정되어 있지 않습니다. 설정창에서 API 키를 입력하거나 불러와 주세요.");
        settingsPanel.classList.remove("hidden");
        return;
      }

      const origBtnText = summarizeBtn.textContent;
      summarizeBtn.disabled = true;
      summarizeBtn.textContent = "요약 중...";

      const glossary = glossaryInput.value.trim();
      const partnerCode = partnerLangSelect.value;
      const partnerInfo = LANG_NAMES[partnerCode];

      const summaryPrompt = [
        `다음은 한국어와 ${partnerInfo.ko}(${partnerInfo.en}) 간 실시간 음성 동시통역으로 기록된 대화 전문입니다.`,
        `이 대화 내용을 면밀히 분석하여 한국어 회의록 요약과 ${partnerInfo.ko}(${partnerInfo.en}) 회의록 요약 두 가지 언어로 나란히 정리한 이중 언어 회의록을 작성해 주세요.`,
        "출력 형식 엄수 규칙:",
        "1. 별표(**)나 샵(#), 하이픈(-) 글머리 기호 같은 마크다운 특수문자를 절대 쓰지 말고 순수 텍스트와 숫자 번호(1., 2., 3., 4.)만 사용해 정리하십시오.",
        "2. 먼저 [한국어 회의록 요약] 제목 아래에 아래 4개 항목을 한국어로 작성하십시오.",
        "1. 전체 대화 주제 및 개요",
        "2. 주요 논의 안건 및 핵심 내용",
        "3. 합의 및 결정 사항 (없으면 '별도 확정 사항 없음'으로 표기)",
        "4. 향후 조치 및 후속 일정 (없으면 '별도 후속 조치 없음'으로 표기)",

    function unlockAudioPlayback() {
      try {
        if (!outputAudioCtx || outputAudioCtx.state === "closed") {
          outputAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        }
        if (outputAudioCtx.state === "suspended") {
          outputAudioCtx.resume();
        }
        if (!outputGainNode) {
          outputGainNode = outputAudioCtx.createGain();
          outputGainNode.gain.value = 1.35;
          outputGainNode.connect(outputAudioCtx.destination);
        }
        const silentBuf = outputAudioCtx.createBuffer(1, 1, 24000);
        const silentSrc = outputAudioCtx.createBufferSource();
        silentSrc.buffer = silentBuf;
        silentSrc.connect(outputGainNode);
        silentSrc.start(0);
        nextPlayTime = outputAudioCtx.currentTime;
      } catch (e) {
        console.warn("AudioContext 초기화 경고:", e);
      }
    }

    function analyzeCloseReason(code, reason) {
      const r = (reason || "").toLowerCase();
      if (r.includes("not found") || r.includes("bidigeneratecontent") || r.includes("not supported")) {
        return "해결 처방: 설정창의 [실시간 음성 모델 ID]를 목록에 있는 gemini-2.0-flash-exp 또는 gemini-2.5-flash-native-audio-preview-09-2025로 변경해 보세요.";
      }
      if (r.includes("api key") || r.includes("permission") || r.includes("unauthenticated")) {
        return "해결 처방: API 키가 잘못되었거나 만료되었습니다. 설정창에서 키 문자열을 다시 확인하세요.";
      }
      if (r.includes("referer") || r.includes("origin") || r.includes("blocked")) {
        return "해결 처방: Google Cloud Console에서 해당 API 키의 [애플리케이션 제한사항]을 '없음'으로 변경해 주세요.";
      }
      if (r.includes("quota") || r.includes("resource_exhausted") || code === 1011) {
        return "해결 처방: 무료 등급의 분당 사용량 한도를 초과했습니다. 잠시 후 다시 시도하거나 상단 배지를 눌러 [유료 키]로 전환하세요.";
      }
      if (code === 1008) {
        return "해결 처방: 정책 위반(1008) 오류입니다. 설정창의 모델 ID와 API 키 권한을 확인해 주세요.";
      }
      return "해결 처방: 네트워크 연결 상태와 API 키를 다시 한 번 점검해 주세요.";
    }

      const hint = document.createElement("div");

      hint.textContent = analyzeCloseReason(code, reason);

      div.appendChild(title);

      div.appendChild(hint);

    function getDynamicRuleText() {
      const partnerCode = partnerLangSelect.value;
      const partnerInfo = LANG_NAMES[partnerCode];
      const mode = autoModeSelect.value;
      const tone = toneSelect.value;

      let toneDesc = "자연스럽고 정중한 존댓말(해요체/하십시오체 및 해당 언어의 공손한 회화체)";
      if (tone === "casual") toneDesc = "자연스럽고 친근한 일상 구어체";
      if (tone === "formal") toneDesc = "비즈니스 협상, 학술 세미나 및 공식 석상에 적합한 격식체";

      if (mode === "auto_both") {
        return [
          `[완전 자동 양방향 동시통역 규칙]`,
          `1. 입력 음성이 한국어(Korean)이면 즉시 ${toneDesc}의 자연스러운 ${partnerInfo.ko}(${partnerInfo.en}) 음성으로 통역하여 말하십시오.`,
          `2. 입력 음성이 영어(English), 중국어(Chinese), 일본어(Japanese), 스페인어(Spanish) 등 외국어이면 즉시 ${toneDesc}의 자연스러운 한국어(Korean) 음성으로 통역하여 말하십시오.`
        ].join("\n");
      } else if (mode === "to_ko_only") {
        return `[듣기 고정 규칙] 입력되는 영어, 중국어, 일본어, 스페인어 음성을 즉시 ${toneDesc}의 한국어(Korean) 음성으로 통역하여 말하십시오.`;
      } else {
        return `[말하기 고정 규칙] 입력되는 한국어(Korean) 음성을 즉시 ${toneDesc}의 ${partnerInfo.ko}(${partnerInfo.en}) 음성으로 통역하여 말하십시오.`;
      }
    }

    function buildSystemInstruction(recentContext = "") {
      const glossary = glossaryInput.value.trim();
      let prompt = [
        "당신은 한국어, 영어, 중국어, 일본어, 스페인어를 자유자재로 구사하는 실시간 음성 동시통역사입니다.",
        getDynamicRuleText(),
        "절대 규칙 1: 질문에 대답하거나 잡담을 하지 마십시오. 오직 들린 문장의 통역 결과만을 즉시 음성으로 발화하십시오.",
        "절대 규칙 2: '번역해 드리겠습니다', '네 알겠습니다' 같은 인사말이나 부연 설명을 일절 붙이지 마십시오.",
        "절대 규칙 3: 단어 직역을 피하고 대화의 앞뒤 문맥과 생략된 주어를 살려 원어민처럼 매끄럽게 말하십시오."
      ].join("\n");

      if (glossary) {
        prompt += `\n[상황 및 필수 용어집]\n${glossary}`;
      }
      if (recentContext) {
        prompt += `\n[직전 대화 맥락 참고용 (이 내용에 대답하지 말고 이어서 들어오는 음성만 통역하십시오)]\n${recentContext}`;
      }
      return prompt;
    }

    async function startSession() {
      const apiKey = getActiveApiKey();
      const tierLabel = activeKeyTier === "paid" ? "유료 키" : "무료 키";

      if (!apiKey) {
        alert(`선택된 [${tierLabel}]가 비어 있습니다. 설정창에서 API 키를 입력하거나 파일로 불러와 주세요.`);
        settingsPanel.classList.remove("hidden");
        return;
      }

      saveSettings();
      settingsPanel.classList.add("hidden");
      setStatus("연결 중...", "normal");
      mainActionBtn.disabled = true;
      isConnecting = true;
      reconnectAttemptCount = 0;

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: 16000,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        if (outputAudioCtx && outputAudioCtx.state === "suspended") {
          await outputAudioCtx.resume();
        }
        nextPlayTime = outputAudioCtx.currentTime;

        startMicCapture();
        requestWakeLock();
        connectWebSocket(false, "", "");
      } catch (err) {
        isConnecting = false;
        mainActionBtn.disabled = false;
        setStatus("마이크 오류", "error");
        alert("마이크 권한 허용이 필요합니다.\n오류 내용: " + err.message);
      }
    }

    function connectWebSocket(isRenewal, recentContext, renewalReason) {
      const apiKey = getActiveApiKey();
      const tierLabel = activeKeyTier === "paid" ? "유료 키" : "무료 키";
      const modelName = modelInput.value.trim() || "gemini-2.0-flash-exp";
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(apiKey)}`;

      const socket = new WebSocket(wsUrl);
      ws = socket;

      socket.onopen = () => {
        if (ws !== socket) return;
        const useVoice = voiceOutputSelect.value === "on";
        const voiceName = voiceNameSelect.value || "Aoede";

        const generationConfig = {
          responseModalities: useVoice ? ["AUDIO"] : ["TEXT"]
        };
        if (useVoice) {
          generationConfig.speechConfig = {
            voiceConfig: {
              prebuiltVoiceConfig: {
                voiceName: voiceName
              }
            }
          };
        }

        const setupObj = {
          model: `models/${modelName}`,
          generationConfig: generationConfig,
          systemInstruction: {
            parts: [{ text: buildSystemInstruction(recentContext) }]
          },
          inputAudioTranscription: {}
        };
        if (useVoice) {
          setupObj.outputAudioTranscription = {};
        }

        socket.send(JSON.stringify({ setup: setupObj }));

        sessionElapsedSec = 0;
        reconnectAttemptCount = 0;
        isConnecting = false;
        isRenewing = false;
        isRunning = true;

        mainActionBtn.disabled = false;
        mainActionBtn.textContent = "통역 중지";
        mainActionBtn.className = "btn-main btn-stop";
        setMicGateVisual(false);
        setStatus("실시간 통역 중", "connected");

        if (!isRenewal) {
          startSessionTimer();
          const partnerKoName = LANG_NAMES[partnerLangSelect.value].ko;
          addSystemMessage(`[${tierLabel}] 연결 완료. 한국어 또는 ${partnerKoName}로 말씀하시면 즉시 음성 통역됩니다.`);
        } else {
          addSystemMessage(`세션 무중단 갱신 완료 (${renewalReason} · 직전 대화 맥락 유지됨)`);
        }
      };

      socket.onmessage = async (event) => {
        if (ws !== socket) return;
        let rawText = event.data;
        if (rawText instanceof Blob) {
          rawText = await rawText.text();
        }
        const data = JSON.parse(rawText);

        if (data.goAway) {
          if (!isRenewing) {
            if (!isAiSpeaking && activeSources.length === 0) {
              triggerSeamlessRenewal("서버 사전 예고 자동 갱신");
            } else {
              renewalPending = true;
            }
          }
          return;
        }

        if (data.error) {
          addErrorDiagnosticMessage(data.error.code || "API_ERROR", data.error.message || JSON.stringify(data.error));
          return;
        }
        handleServerMessage(data);
      };

      socket.onerror = () => {
        if (ws !== socket) return;
        setStatus("연결 오류", "error");
      };

      socket.onclose = (e) => {
        if (ws !== socket) return;
        if (isRenewing) return;

        const wasActive = isRunning || isConnecting;
        if (!wasActive) return;

        const isFatalPolicyError = e.code === 1008;
        if (isRunning && !isFatalPolicyError && e.code !== 1000 && reconnectAttemptCount < 3) {
          reconnectAttemptCount += 1;
          addSystemMessage(`일시적 연결 끊김(코드 ${e.code}) 감지: 자동 재연결 시도 중 (${reconnectAttemptCount}/3)...`);
          triggerSeamlessRenewal(`자동 복구 ${reconnectAttemptCount}회차`);
          return;
        }

        if (e.code !== 1000 && e.code !== 1005) {
          setStatus(`오류 (${e.code})`, "error");
          addErrorDiagnosticMessage(e.code, e.reason);
        } else {
          addSystemMessage(`통역 세션이 종료되었습니다. (코드: ${e.code})`);
        }
        cleanupResources();
      };
    }

    function handleServerMessage(data) {
      const serverContent = data.serverContent;
      if (!serverContent) return;

      if (serverContent.interrupted) {
        stopAllPlayingAudio();
        currentTranslatedBubble = null;
        return;
      }

      if (serverContent.inputTranscription && serverContent.inputTranscription.text) {
        appendUserTranscript(serverContent.inputTranscription.text);
      }

      if (serverContent.outputTranscription && serverContent.outputTranscription.text) {
        currentUserBubble = null;
        appendTranslatedText(serverContent.outputTranscription.text);
      }

      if (serverContent.modelTurn && serverContent.modelTurn.parts) {
        currentUserBubble = null;
        for (const part of serverContent.modelTurn.parts) {
          if (part.text) {
            appendTranslatedText(part.text);
          }
          if (part.inlineData && part.inlineData.mimeType && part.inlineData.mimeType.startsWith("audio/pcm")) {
            if (voiceOutputSelect.value === "on") {
              playPcmChunk(part.inlineData.data);
            }
          }
        }
      }

      if (serverContent.turnComplete) {
        currentTranslatedBubble = null;
        currentUserBubble = null;
        if (renewalPending && activeSources.length === 0 && !isAiSpeaking) {
          triggerSeamlessRenewal("대화 턴 완료 후 자동 갱신");
        }
      }
    }

    function startMicCapture() {
      if (inputAudioCtx) return;
      inputAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = inputAudioCtx.createMediaStreamSource(micStream);
      processorNode = inputAudioCtx.createScriptProcessor(4096, 1, 1);

      processorNode.onaudioprocess = (e) => {
        if (!isRunning || isRenewing || !ws || ws.readyState !== WebSocket.OPEN) return;

        const blockEcho = echoGuardSelect.value === "speaker" && isAiSpeaking;
        if (blockEcho) {
          return;
        }

        const float32Data = e.inputBuffer.getChannelData(0);

        let sum = 0;
        for (let i = 0; i < float32Data.length; i++) {
          sum += float32Data[i] * float32Data[i];
        }
        const rms = Math.sqrt(sum / float32Data.length);
        const level = Math.min(100, Math.round(rms * 450));
        volumeFill.style.width = level + "%";

        const int16Buffer = new Int16Array(float32Data.length);
        for (let i = 0; i < float32Data.length; i++) {
          const s = Math.max(-1, Math.min(1, float32Data[i]));
          int16Buffer[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        const base64Audio = arrayBufferToBase64(int16Buffer.buffer);

        ws.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{
              mimeType: "audio/pcm;rate=16000",
              data: base64Audio
            }]
          }
        }));
      };

      source.connect(processorNode);
      processorNode.connect(inputAudioCtx.destination);
    }

    function playPcmChunk(base64Data) {
      if (!outputAudioCtx) return;
      if (outputAudioCtx.state === "suspended") {
        outputAudioCtx.resume();
      }

      if (echoGuardTimer) {
        clearTimeout(echoGuardTimer);
        echoGuardTimer = null;
      }

      isAiSpeaking = true;
      if (echoGuardSelect.value === "speaker") {
        setMicGateVisual(true);
        setStatus("음성 송출 중 (에코 차단)", "speaking");
      } else {
        setStatus("통역 음성 출력 중", "speaking");
      }

      const arrayBuffer = base64ToArrayBuffer(base64Data);
      const int16Array = new Int16Array(arrayBuffer);
      const float32Array = new Float32Array(int16Array.length);

      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768.0;
      }

      const audioBuffer = outputAudioCtx.createBuffer(1, float32Array.length, 24000);
      audioBuffer.getChannelData(0).set(float32Array);

      const source = outputAudioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(outputGainNode || outputAudioCtx.destination);

      const startTime = Math.max(outputAudioCtx.currentTime, nextPlayTime);
      source.start(startTime);
      nextPlayTime = startTime + audioBuffer.duration;

      activeSources.push(source);
      source.onended = () => {
        activeSources = activeSources.filter(s => s !== source);
        if (activeSources.length === 0) {
          echoGuardTimer = setTimeout(() => {
            isAiSpeaking = false;
            echoGuardTimer = null;
            if (isRunning) {
              setMicGateVisual(false);
              setStatus("실시간 통역 중", "connected");
              if (renewalPending) {
                triggerSeamlessRenewal("12분 주기 자동 갱신");
              }
            }
          }, 450);
        }
      };
    }

    function stopAllPlayingAudio() {
      if (echoGuardTimer) {
        clearTimeout(echoGuardTimer);
        echoGuardTimer = null;
      }
      for (const src of activeSources) {
        try { src.stop(); } catch (e) {}
      }
      activeSources = [];
      isAiSpeaking = false;
      if (outputAudioCtx) {
        nextPlayTime = outputAudioCtx.currentTime;
      }
      if (isRunning) {
        setMicGateVisual(false);
        setStatus("실시간 통역 중", "connected");
      }
    }

    function cleanupResources() {
      isRunning = false;
      isConnecting = false;
      isRenewing = false;
      renewalPending = false;
      stopSessionTimer();
      releaseWakeLock();
      stopAllPlayingAudio();
      setMicGateVisual(false);

      if (processorNode) {
        processorNode.disconnect();
        processorNode = null;
      }
      if (inputAudioCtx) {
        inputAudioCtx.close().catch(() => {});
        inputAudioCtx = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }

      mainActionBtn.disabled = false;
      mainActionBtn.textContent = "통역 시작";
      mainActionBtn.className = "btn-main btn-start";
    }

    function stopSession() {
      const oldWs = ws;
      ws = null;
      cleanupResources();
      if (oldWs) {
        if (oldWs.readyState === WebSocket.OPEN || oldWs.readyState === WebSocket.CONNECTING) {
          oldWs.close(1000, "User stopped");
        }
      }
      setStatus("대기 중", "normal");
    }

    function arrayBufferToBase64(buffer) {
      let binary = "";
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }
  </script>
